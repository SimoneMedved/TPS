<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Index</title>
    <!-- Google Fonts per un font più moderno -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        /* VARIABILI COLORE (Stile Moderno/Dark) */
        :root {
            --bg-color: #0b0f19;
            --container-bg: #1e293b;
            --item-bg: #111827;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            --border-color: rgba(255, 255, 255, 0.05);
        }

        /* Stili generali della pagina */
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* Contenitore principale */
        .container {
            background-color: var(--container-bg);
            padding: 30px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
            width: 350px;
        }

        /* Titolo */
        h1 {
            font-size: 24px;
            font-weight: 800;
            margin-top: 0;
            margin-bottom: 20px;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }

        /* Lista */
        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        /* Singolo elemento della lista */
        li {
            margin-bottom: 10px;
            border-radius: 8px;
            background-color: var(--item-bg);
            border: 1px solid var(--border-color);
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        }

        /* Gestione del link a tutto spazio */
        li a {
            display: block;
            padding: 14px 18px;
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            transition: color 0.2s ease;
        }

        /* Effetto al passaggio del mouse sull'elemento */
        li:hover {
            transform: translateX(6px);
            border-color: #6366f1;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.15);
        }

        /* Cambia il colore del testo quando passi il mouse */
        li:hover a {
            color: var(--text-main);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>I miei Lavori</h1>
        <ul>
            <li><a href="Anagrafica_1_0.html">Anagrafica 1.0</a></li>
        </ul>
    </div>

</body>
</html>
