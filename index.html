<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Indice Elementi Moderno</title>
    <style>
        /* Stili generali della pagina */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* Contenitore principale */
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            width: 350px;
        }

        /* Titolo */
        h1 {
            font-size: 24px;
            margin-top: 0;
            color: #2c3e50;
            border-bottom: 2px solid #eceff1;
            padding-bottom: 10px;
        }

        /* Lista */
        ul {
            list-style: none; /* Rimuove i pallini classici */
            padding: 0;
            margin: 0;
        }

        /* Singolo elemento */
        li {
            padding: 12px 15px;
            background-color: #f8f9fa;
            margin-bottom: 8px;
            border-radius: 6px;
            border-left: 4px solid #3498db; /* Linea blu decorativa a sinistra */
            transition: transform 0.2s, background-color 0.2s;
            font-size: 16px;
        }

        /* Effetto al passaggio del mouse */
        li:hover {
            background-color: #2e95e4;
            transform: translateX(5px); /* Si sposta leggermente a destra */
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>I miei Elementi</h1>
        <ul>
            <li><a href="Anagrafica_1_0.html">Anagrafica</a></li>
            <li>Elemento 2</li>
            <li>Elemento 3</li>
            <li>Elemento 4</li>
        </ul>
    </div>

</body>
</html>
